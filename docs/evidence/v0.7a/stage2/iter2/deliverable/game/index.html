<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="无尽矿脉 — 点击挖矿、升级钻头、开采稀有矿脉的放置小游戏原型">
<title>无尽矿脉</title>
<style>
/* ============ 基础 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: radial-gradient(ellipse at 50% -10%, #3a2a12 0%, #1d1509 55%, #0f0b06 100%);
  color: #f5e9c8;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
#app {
  max-width: 26rem;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}
.hidden { display:none !important; }

/* ============ 顶栏 ============ */
#topbar {
  display:flex; align-items:center; gap:.5rem;
  padding:.55rem .9rem .4rem;
  background: linear-gradient(180deg, rgba(0,0,0,.35), transparent);
}
#coinbox { flex:1; min-width:0; }
#coinlabel { font-size:.7rem; color:#c9a86a; letter-spacing:.1em; }
#coins {
  font-size:1.55rem; font-weight:800; line-height:1.1;
  color:#ffd970; text-shadow:0 .15rem .4rem rgba(255,180,40,.35);
  display:flex; align-items:center; gap:.35rem;
}
#coins .coin-ico { font-size:1.2rem; }
#coins.pulse { animation: coinPulse 1s ease-in-out infinite; }
@keyframes coinPulse {
  0%,100% { transform:scale(1); filter:drop-shadow(0 0 .2rem rgba(255,200,60,.2)); }
  50% { transform:scale(1.14); filter:drop-shadow(0 0 .8rem rgba(255,200,60,.9)); }
}
#netchip {
  font-size:.72rem; color:#8fe3a0; background:rgba(40,110,60,.25);
  border:.1rem solid rgba(120,220,150,.35);
  border-radius:.8rem; padding:.25rem .55rem; white-space:nowrap;
}
#netchip.neg { color:#ff9a8a; border-color:rgba(255,140,110,.4); background:rgba(140,50,40,.25); }
#daychip {
  font-size:.72rem; color:#cbb88a; background:rgba(90,70,35,.4);
  border:.1rem solid rgba(200,170,110,.3);
  border-radius:.8rem; padding:.25rem .55rem; white-space:nowrap;
}
#mutebtn, #resetbtn {
  font-size:1.05rem; background:rgba(90,70,35,.4);
  border:.1rem solid rgba(200,170,110,.3);
  border-radius:.7rem; padding:.3rem .5rem; color:#f5e9c8;
}

/* ============ 矿层进度条 ============ */
#layerbar {
  display:flex; align-items:center; gap:.6rem;
  padding:.15rem .9rem .35rem;
}
#lvname { font-size:.8rem; font-weight:700; color:#ffd970; white-space:nowrap; }
#xpwrap { flex:1; height:1rem; background:rgba(0,0,0,.4); border-radius:.5rem; overflow:hidden; border:.1rem solid rgba(200,170,110,.25); }
#xpfill {
  height:100%; width:0%;
  background:linear-gradient(90deg,#8a5a14,#ffb52e);
  border-radius:.4rem; transition:width .25s ease;
}
#xptext { font-size:.68rem; color:#c9a86a; white-space:nowrap; }
#remaining { font-size:.72rem; color:#ff9a8a; white-space:nowrap; }

/* ============ 限时矿脉条 ============ */
#veinstrip {
  margin:.1rem .9rem .35rem; padding:.5rem .6rem;
  background:linear-gradient(135deg, rgba(255,190,60,.18), rgba(180,80,20,.22));
  border:.1rem solid rgba(255,200,80,.5);
  border-radius:.9rem;
}
#veinhead { display:flex; align-items:center; justify-content:space-between; font-size:.72rem; color:#ffe9b0; margin-bottom:.4rem; }
#veincount { font-weight:800; color:#ff6a4a; font-size:.9rem; }
#veingrid { display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem; }

/* ============ 矿石网格 ============ */
#gridwrap { flex:1; min-height:0; overflow-y:auto; padding:.15rem .9rem .6rem; scrollbar-width:none; }
#gridwrap::-webkit-scrollbar { display:none; }
#grid { display:grid; grid-template-columns:repeat(5,1fr); gap:.55rem; }
.ore {
  position:relative; aspect-ratio:1/1;
  border:none; border-radius:38% 62% 55% 45% / 45% 55% 40% 60%;
  cursor:pointer; touch-action:manipulation;
  transition:transform .08s ease;
  box-shadow:inset -.2rem -.3rem .6rem rgba(0,0,0,.45), inset .15rem .2rem .3rem rgba(255,255,255,.18), 0 .2rem .4rem rgba(0,0,0,.4);
}
.ore:active { transform:scale(.9); }
.ore .hpbar {
  position:absolute; left:12%; right:12%; bottom:8%;
  height:.28rem; background:rgba(0,0,0,.5); border-radius:.2rem; overflow:hidden;
}
.ore .hpbar i { display:block; height:100%; background:#8fe3a0; border-radius:.2rem; }
.ore .qmark {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:1.25rem; font-weight:800; color:#ffe9b0;
  text-shadow:0 .1rem .3rem rgba(0,0,0,.8);
  background:rgba(20,14,4,.45);
  border-radius:inherit; animation:qPulse 1.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes qPulse { 0%,100%{opacity:1} 50%{opacity:.55} }
.ore-copper { background:radial-gradient(circle at 32% 28%, #e8a24c, #b06a1e 55%, #7c4610); }
.ore-iron   { background:radial-gradient(circle at 32% 28%, #c6ccd4, #8a9099 55%, #52575e); }
.ore-fake   { background:radial-gradient(circle at 32% 28%, #aeb4bc, #787e86 55%, #41464d); box-shadow:inset -.2rem -.3rem .6rem rgba(0,0,0,.5), inset .15rem .2rem .3rem rgba(255,255,255,.08), 0 .2rem .4rem rgba(0,0,0,.4); }
.ore-rare {
  background:radial-gradient(circle at 32% 28%, #ffe9a0, #ffb52e 55%, #b26a00);
  animation:rareGlow 1.6s ease-in-out infinite;
}
@keyframes rareGlow {
  0%,100% { box-shadow:0 0 .35rem rgba(255,190,60,.5), inset 0 0 .5rem rgba(255,255,255,.35); }
  50% { box-shadow:0 0 1.1rem rgba(255,200,80,.95), inset 0 0 .7rem rgba(255,255,255,.5); }
}
.ore .gem { position:absolute; top:12%; left:50%; transform:translateX(-50%); font-size:1rem; filter:drop-shadow(0 .1rem .2rem rgba(0,0,0,.6)); }
.ore.shatter { animation:shatter .45s ease-out forwards; }
@keyframes shatter {
  0% { transform:scale(1); opacity:1; }
  30% { transform:scale(1.15) rotate(6deg); }
  100% { transform:scale(.4) rotate(-20deg); opacity:0; }
}
.ore.wobble { animation:wobble .18s ease; }
@keyframes wobble { 0%{transform:translateX(0)} 30%{transform:translateX(-.25rem)} 60%{transform:translateX(.25rem)} 100%{transform:translateX(0)} }
.ore.spark { animation:spark .5s ease; }
@keyframes spark { 0%{transform:scale(1)} 40%{transform:scale(1.2)} 100%{transform:scale(1)} }
.ore.fadeout { animation:fadeOut .5s ease forwards; }
@keyframes fadeOut { to { transform:scale(.3); opacity:0; } }

/* 金币飘字 */
.coin-fly {
  position:fixed; z-index:60; font-size:1rem; font-weight:800; color:#ffd970;
  pointer-events:none; text-shadow:0 .1rem .2rem rgba(0,0,0,.7);
  animation:flyTo .8s ease-out forwards;
}
@keyframes flyTo {
  0% { opacity:1; }
  100% { transform:translate(34vw,-42vh) scale(.6); opacity:0; }
}
.gain-fly {
  position:fixed; z-index:60; font-weight:800; pointer-events:none;
  animation:gainUp 1s ease-out forwards;
}
@keyframes gainUp { 0%{opacity:1; transform:translateY(0)} 100%{opacity:0; transform:translateY(-4rem)} }

/* ============ 底部升级区 ============ */
#upgrades {
  display:grid; grid-template-columns:1fr 1fr; gap:.6rem;
  padding:.4rem .9rem .35rem;
  background:linear-gradient(0deg, rgba(0,0,0,.4), transparent);
}
.upcard {
  border:.1rem solid rgba(200,170,110,.35);
  background:linear-gradient(160deg, rgba(120,90,40,.5), rgba(60,42,16,.65));
  border-radius:.9rem; padding:.5rem .65rem;
  color:#f5e9c8; text-align:left; cursor:pointer;
  transition:transform .08s ease;
}
.upcard:active { transform:scale(.96); }
.upcard .upname { font-size:.8rem; font-weight:700; color:#ffd970; }
.upcard .updesc { font-size:.66rem; color:#cbb88a; margin:.15rem 0; line-height:1.25; }
.upcard .upcost { font-size:.85rem; font-weight:800; color:#ffe9b0; }
.upcard .upcost .ico { font-size:.75rem; }
.upcard .upgap { font-size:.7rem; color:#ff9a8a; font-weight:700; }
.upcard.disabled { opacity:.55; }
.upcard.locked { opacity:.5; filter:grayscale(.6); }
.upcard .upflag { font-size:.66rem; color:#8fe3a0; }

/* ============ 底部导航 ============ */
#tabs {
  display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem;
  padding:.35rem .9rem calc(.6rem + env(safe-area-inset-bottom));
}
.tab {
  border:.1rem solid rgba(200,170,110,.3);
  background:rgba(90,70,35,.35);
  border-radius:.8rem; padding:.5rem 0; font-size:.78rem; color:#e8d5a8;
  cursor:pointer;
}
.tab:active { transform:scale(.95); }

/* ============ 遮罩与面板 ============ */
#mask { position:fixed; inset:0; z-index:100; background:rgba(5,3,1,.72); display:none; }
#mask.show { display:block; }
.panel {
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(21rem, 92vw); max-height:82dvh; overflow-y:auto;
  background:linear-gradient(170deg, #4a3515, #2a1d0a);
  border:.12rem solid rgba(255,210,110,.55);
  border-radius:1.2rem; padding:1.1rem 1.15rem;
  box-shadow:0 .8rem 3rem rgba(0,0,0,.7);
  display:none; z-index:110;
}
.panel.active { display:block; }
.panel h2 { font-size:1.05rem; color:#ffd970; text-align:center; margin-bottom:.5rem; }
.panel .sub { font-size:.8rem; color:#cbb88a; text-align:center; line-height:1.5; margin-bottom:.7rem; }
.panel .big { text-align:center; font-size:1.3rem; font-weight:800; color:#ffe9b0; margin:.3rem 0 .7rem; }
.btnrow { display:flex; gap:.6rem; margin-top:.8rem; }
.btn {
  flex:1; border:none; border-radius:.9rem;
  background:linear-gradient(180deg, #ffc84d, #e8930a);
  color:#3a2205; font-size:.95rem; font-weight:800;
  padding:.7rem .4rem; cursor:pointer;
  box-shadow:0 .2rem .5rem rgba(0,0,0,.4);
}
.btn:active { transform:scale(.96); }
.btn.ghost { background:rgba(120,95,50,.35); color:#e8d5a8; border:.1rem solid rgba(200,170,110,.35); box-shadow:none; }
.btn.green { background:linear-gradient(180deg, #7fe09a, #2f9e58); color:#0c3418; }
.btn.orange { background:linear-gradient(180deg, #ffb74d, #e07a0a); color:#3a2205; }
.btn:disabled { opacity:.5; }
.reward-line { font-size:.8rem; color:#8fe3a0; text-align:center; margin-top:.5rem; }

/* 引导 */
#guide {
  position:fixed; inset:0; z-index:200;
  background:rgba(5,3,1,.55);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:calc(13.2rem + env(safe-area-inset-bottom));
  pointer-events:none;
}
#guide .gcard {
  pointer-events:auto;
  background:linear-gradient(170deg, #5a421a, #33230c);
  border:.12rem solid rgba(255,210,110,.6);
  border-radius:1rem; padding:.8rem 1.1rem;
  width:min(19rem, 86vw);
  text-align:center;
}
#guide .gtxt { font-size:.95rem; font-weight:700; color:#ffe9b0; line-height:1.5; }
#guide .ghint { font-size:.72rem; color:#cbb88a; margin-top:.3rem; }
#guide .gbtnrow { display:flex; gap:.6rem; margin-top:.7rem; }
#guide .gbtn { flex:1; border:none; border-radius:.8rem; padding:.55rem 0; font-size:.85rem; font-weight:800; cursor:pointer; }
#guide .gbtn.next { background:linear-gradient(180deg,#ffc84d,#e8930a); color:#3a2205; }
#guide .gbtn.skip { background:rgba(120,95,50,.35); color:#cbb88a; border:.1rem solid rgba(200,170,110,.35); }
.gfinger { position:fixed; z-index:201; font-size:1.9rem; pointer-events:none; animation:handBounce 1s ease-in-out infinite; }
@keyframes handBounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-.6rem) scale(1.1)} }
.gring {
  position:fixed; z-index:199; pointer-events:none; border-radius:1rem;
  border:.18rem solid #ffd970; animation:ringPulse 1s ease-in-out infinite;
}
@keyframes ringPulse { 0%,100%{box-shadow:0 0 .3rem rgba(255,217,112,.5)} 50%{box-shadow:0 0 1.2rem rgba(255,217,112,1)} }

/* 广告模拟 */
#adPanel .adfake { text-align:center; margin:.4rem 0 .6rem; }
.adicon { font-size:2.4rem; animation:adSpin 1.2s linear infinite; display:inline-block; }
@keyframes adSpin { to { transform:rotate(360deg); } }
#adCount { font-size:1.4rem; font-weight:800; color:#ffd970; margin:.3rem 0; }
.adtag { display:inline-block; font-size:.62rem; color:#3a2205; background:#ffd970; border-radius:.4rem; padding:.1rem .4rem; margin-bottom:.5rem; }

/* 排行 */
.rankrow { display:flex; align-items:center; gap:.6rem; padding:.55rem .4rem; border-bottom:.06rem solid rgba(200,170,110,.15); }
.rankrow .rk { width:1.6rem; font-weight:800; color:#c9a86a; font-size:.9rem; text-align:center; }
.rankrow .rk.top1 { color:#ffd970; }
.rankrow .rk.top2 { color:#c8d6e5; }
.rankrow .rk.top3 { color:#e8a06a; }
.rankrow .rkava { font-size:1.15rem; }
.rankrow .rkname { flex:1; font-size:.85rem; }
.rankrow .rkval { font-size:.85rem; font-weight:800; color:#ffe9b0; }
.rankrow.me { background:rgba(255,200,80,.12); border-radius:.6rem; border:.08rem solid rgba(255,210,110,.4); }
.ranktabs { display:flex; gap:.5rem; margin-bottom:.6rem; }
.ranktab { flex:1; border:.1rem solid rgba(200,170,110,.3); background:rgba(90,70,35,.35); border-radius:.7rem; padding:.45rem 0; font-size:.78rem; color:#e8d5a8; cursor:pointer; }
.ranktab.on { background:rgba(255,200,80,.22); color:#ffd970; border-color:rgba(255,210,110,.6); }

/* 任务 */
.questrow { display:flex; align-items:center; gap:.6rem; padding:.5rem .3rem; border-bottom:.06rem solid rgba(200,170,110,.12); }
.questrow .qst { font-size:1.1rem; }
.questrow .qinfo { flex:1; }
.questrow .qlab { font-size:.8rem; line-height:1.4; }
.questrow .qprog { font-size:.7rem; color:#cbb88a; margin-top:.15rem; }
.questrow.done .qlab { color:#8fe3a0; }
.questrow .qrew { font-size:.72rem; color:#ffd970; white-space:nowrap; }
#daytarget { margin:.6rem 0 .3rem; }
#daytarget .dtrow { display:flex; justify-content:space-between; font-size:.72rem; color:#cbb88a; margin-bottom:.25rem; }
#dtbar { height:.9rem; background:rgba(0,0,0,.4); border-radius:.5rem; overflow:hidden; border:.08rem solid rgba(200,170,110,.25); }
#dtfill { height:100%; width:0%; background:linear-gradient(90deg,#2f9e58,#7fe09a); border-radius:.4rem; transition:width .3s ease; }
#chestbtn { width:100%; margin-top:.6rem; }

/* 背包 */
.packgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.6rem; }
.packcell { background:rgba(0,0,0,.3); border:.08rem solid rgba(200,170,110,.25); border-radius:.8rem; padding:.55rem .3rem; text-align:center; }
.packcell .picon { font-size:1.5rem; }
.packcell .pname { font-size:.68rem; color:#cbb88a; margin-top:.2rem; }
.packcell .pnum { font-size:.8rem; font-weight:800; color:#ffe9b0; }
.packcell.empty { opacity:.45; }
.packcell .pslots { font-size:.68rem; color:#ff9a8a; }
#packslots { text-align:center; font-size:.72rem; color:#cbb88a; margin-top:.5rem; }

/* 分享卡 */
#shareCard .sc-body {
  background:linear-gradient(160deg, #5a421a, #2a1d0a);
  border:.1rem solid rgba(255,210,110,.5);
  border-radius:1rem; padding:.9rem;
  margin:.5rem 0 .7rem;
}
.sc-title { font-size:.8rem; color:#c9a86a; letter-spacing:.15em; text-align:center; }
.sc-line { display:flex; justify-content:space-between; font-size:.85rem; padding:.3rem 0; border-bottom:.06rem dashed rgba(200,170,110,.3); }
.sc-line b { color:#ffd970; }
.sc-copy { font-size:.78rem; color:#cbb88a; line-height:1.6; margin-top:.6rem; text-align:center; }

/* 离线 */
.offline-big { font-size:1.9rem; font-weight:800; color:#ffd970; text-align:center; margin:.5rem 0 .2rem; }
.offline-sub { text-align:center; font-size:.75rem; color:#cbb88a; margin-bottom:.7rem; }

/* toast */
#toast {
  position:fixed; left:50%; top:4.5rem; transform:translateX(-50%);
  z-index:300; max-width:88vw;
  background:rgba(20,13,3,.92); color:#ffe9b0;
  border:.1rem solid rgba(255,210,110,.5); border-radius:.8rem;
  padding:.5rem 1rem; font-size:.82rem; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
  text-align:center;
}
#toast.show { opacity:1; }

/* 飘字颜色 */
.gain-gold { color:#ffd970; }
.gain-red { color:#ff8a72; }
.gain-green { color:#8fe3a0; }
.gain-blue { color:#8fd8ff; }

/* 小屏适配 */
@media (max-width: 22rem) {
  #coins { font-size:1.3rem; }
  .upcard .updesc { font-size:.6rem; }
  .ore .gem { font-size:.85rem; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="coinbox">
      <div id="coinlabel">金币</div>
      <div id="coins" data-coins>0 <span class="coin-ico">🪙</span></div>
    </div>
    <span id="netchip" data-net>今日 +0</span>
    <span id="daychip" data-day>第1天</span>
    <button id="mutebtn" data-act="mute" aria-label="声音开关">🔊</button>
    <button id="resetbtn" data-act="reset" aria-label="重新开始">↺</button>
  </header>

  <div id="layerbar">
    <span id="lvname" data-layer>1层 · 铜矿层</span>
    <div id="xpwrap"><div id="xpfill" data-xp></div></div>
    <span id="xptext">0/20</span>
    <span id="remaining" data-remaining></span>
  </div>

  <div id="veinstrip" class="hidden" data-vein>
    <div id="veinhead"><span>✨ 限时稀有矿脉</span><span id="veincount">60s</span></div>
    <div id="veingrid"></div>
  </div>

  <div id="gridwrap"><div id="grid" data-grid></div></div>

  <div id="upgrades">
    <button class="upcard" data-act="upgrade-drill" id="drillcard">
      <div class="upname">⛏️ 钻头 <span id="drilllv">1级</span></div>
      <div class="updesc" id="drilldesc">点击力 +1</div>
      <div class="upcost" id="drillcost"><span class="ico">🪙</span> 10</div>
    </button>
    <button class="upcard" data-act="upgrade-miner" id="minercard">
      <div class="upname">🤖 自动矿工 <span id="minerlv">未解锁</span></div>
      <div class="updesc" id="minerdesc">每秒产出金币</div>
      <div class="upcost" id="minercost"><span class="ico">🪙</span> 60</div>
    </button>
  </div>

  <nav id="tabs">
    <button class="tab" data-act="pack">🎒 背包</button>
    <button class="tab" data-act="quest">📋 任务</button>
    <button class="tab" data-act="rank">🏆 排行</button>
    <button class="tab" data-act="share-card">📤 分享</button>
  </nav>
</div>

<!-- ============ 遮罩与面板 ============ -->
<div id="mask" data-mask>
  <!-- 里程碑 -->
  <div class="panel" data-panel="milestone">
    <h2>🎉 矿场扩建完成！</h2>
    <div class="sub" id="ms-text"></div>
    <div class="reward-line" id="ms-reward"></div>
    <div class="btnrow"><button class="btn" data-act="milestone-continue">继续开采</button></div>
  </div>

  <!-- 假矿 -->
  <div class="panel" data-panel="fake">
    <h2>💥 矿脉表面碎裂了…</h2>
    <div class="sub">深处可能还有矿藏，<br>重新勘探一次？</div>
    <div class="btnrow">
      <button class="btn ghost" data-act="fake-dismiss">算了</button>
      <button class="btn orange" data-act="reroll-free" id="rerollBtn">重新勘探</button>
    </div>
  </div>

  <!-- 枯竭-差一点 -->
  <div class="panel" data-panel="gap">
    <h2>⛏️ 矿脉枯竭</h2>
    <div class="big" id="gap-text"></div>
    <div class="btnrow">
      <button class="btn ghost" data-act="layer-restart">重开矿脉</button>
      <button class="btn green" data-act="gap-ad" id="gapAdBtn"></button>
    </div>
  </div>

  <!-- 枯竭-普通 -->
  <div class="panel" data-panel="depleted">
    <h2>⛏️ 矿脉枯竭</h2>
    <div class="sub">这片矿层已挖尽。<br>重开矿脉，继续挖吧！</div>
    <div class="btnrow"><button class="btn" data-act="layer-restart">重开矿脉</button></div>
  </div>

  <!-- 背包满 -->
  <div class="panel" data-panel="packfull">
    <h2>💎 发现稀有矿脉！</h2>

<div id="toast" data-toast></div>

<script>
(function () {
'use strict';

/* ================= 配置 ================= */
var SAVE_KEY = 'wmkuang_save_v1';
var DEBUG = (location.hash || '').indexOf('debug') >= 0;
var AD_MS = 2500;

var LAYERS = [
  { depth: 1, xpNeed: 0,    ores: 3,  infinite: true,  cu: 100, fe: 0,  fake: 0,  rare: 0,  name: '铜矿层', reward: 0 },
  { depth: 2, xpNeed: 20,   ores: 27, infinite: false, cu: 60,  fe: 30, fake: 10, rare: 8,  name: '铁矿层', reward: 30 },
  { depth: 3, xpNeed: 100,  ores: 35, infinite: false, cu: 50,  fe: 30, fake: 15, rare: 8,  name: '深岩层', reward: 80 },
  { depth: 4, xpNeed: 500,  ores: 45, infinite: false, cu: 40,  fe: 35, fake: 18, rare: 10, name: '暗晶层', reward: 200 },
  { depth: 5, xpNeed: 2500, ores: 60, infinite: false, cu: 35,  fe: 35, fake: 20, rare: 10, name: '炽焰层', reward: 500 },
  { depth: 6, xpNeed: 12500, ores: 80, infinite: false, cu: 30, fe: 35, fake: 22, rare: 12, name: '星辉层', reward: 1200 }
];

var RARES = {
  amethyst: { key: 'amethyst', name: '紫水晶', ico: '🟣', value: 25,  weight: 70 },
  ruby:     { key: 'ruby',     name: '红宝石', ico: '🔴', value: 80,  weight: 20 },
  emerald:  { key: 'emerald',  name: '祖母绿', ico: '🟢', value: 250, weight: 8 },
  diamond:  { key: 'diamond',  name: '钻石',   ico: '🔷', value: 800, weight: 2 }
};

var DRILL_COSTS = [10, 15, 50, 125, 340, 950, 2600, 7300, 20500, 57000, 160000];
var MINER_COSTS = [60, 140, 330, 780, 1850, 4400, 10500, 25000, 60000, 145000];
var MINER_RATES = [0.5, 1.2, 2.8, 6.5, 15, 35, 80, 185, 420, 950];

var TARGETS = [ { need: 500, reward: 50 }, { need: 2000, reward: 150 }, { need: 8000, reward: 400 }, { need: 25000, reward: 1000 } ];

var FRIENDS_ASSET = [ { name: '王大锤', asset: 12840, ava: '⛏️' }, { name: '李铁柱', asset: 8320, ava: '🧱' }, { name: '张矿工', asset: 5150, ava: '⛑️' }, { name: '刘金矿', asset: 3760, ava: '💎' } ];
var FRIENDS_DAY = [ { name: '王大锤', net: 320 }, { name: '李铁柱', net: 185 }, { name: '张矿工', net: 96 }, { name: '刘金矿', net: 47 } ];

var GUIDE_STEPS = [
  { txt: '点击矿石，挖矿赚金币！', hint: '点一下矿石，看看会发生什么', finger: true },
  { txt: '金币够了就点【升级钻头】，越挖越快！', hint: '攒到 10 金币后升级钻头', finger: true },
  { txt: '挖满经验矿场就会扩建——扩建后小心「假矿」！', hint: '假矿表面碎裂，还会扣金币', finger: false }
];

/* ================= 状态 ================= */
var S = null;
var gameState = 'playing';
var DBG = { nextKind: null };
var oreSeq = 0;
var audioCtx = null;
var muted = false;
var adTimer = null;
var veinScheduler = null;
var veinTimer = null;
var minerTimer = null;
var saveTimer = null;
var _lastTime = 0;
var pendingOfflineBonus = 0;
var curTargetIdx = 0;
var curFakeOreIdx = -1;
var curPackKey = null;
var toastTimer = null;

function defaultState() {
  return {
    coins: 0, xp: 0, mineLevel: 1, drillLv: 1, minerLv: 0,
    day: '', dayEarned: 0, daySpent: 0,
    adCounts: { reroll: 0, gap: 0, pack: 0, offline: 0 },
    shareCount: 0, fakeCountToday: 0, questAmethyst: 0, questDrill: 0, questVein: 0,
    chestClaimed: false, dayTargetClaimed: [],
    inventory: { amethyst: 0, ruby: 0, emerald: 0, diamond: 0 },
    packSlots: 6, pity: 0,
    layer: null, lastSeen: null,
    firstPlayDate: null, careerEarned: 0, careerSpent: 0,
    guideDone: false, veinUnlockSeen: false
  };
}

/* ================= 工具 ================= */
function $(id) { return document.getElementById(id); }

function fmtNum(n) {
  n = Math.floor(n);
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return String(n);
}

function dayKeyStr(d) {
  var m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd);
}

function layerConfig(dep) {
  var cfg = null;
  for (var i = 0; i < LAYERS.length; i++) {
    if (LAYERS[i].depth === dep) { cfg = LAYERS[i]; break; }
  }
  if (!cfg) cfg = LAYERS[LAYERS.length - 1];
  return cfg;
}

function nextDrillCost() {
  if (S.drillLv - 1 >= DRILL_COSTS.length) return -1;
  return DRILL_COSTS[S.drillLv - 1];
}

function nextMinerCost() {
  if (S.minerLv >= MINER_COSTS.length) return -1;
  return MINER_COSTS[S.minerLv];
}

function nextUpgradeCost() {
  var d = nextDrillCost(), m = nextMinerCost();
  var list = [];
  if (d > 0) list.push(d);
  if (m > 0) list.push(m);
  if (!list.length) return -1;
  return Math.min.apply(null, list);
}

/* ================= 存档 ================= */
function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  } catch (e) {
    console.warn('saveState failed', e);
  }
}

function touchSeen() {
  if (DBG.skipSeen) return;
  S.lastSeen = Date.now();
  saveState();
}

function loadState() {
  var raw = null;
  try {
    raw = localStorage.getItem(SAVE_KEY);
  } catch (e) {
    console.warn('loadState failed', e);
  }
  var base = defaultState();
  if (raw) {
    try {
      var d = JSON.parse(raw);
      for (var k in base) {
        if (d[k] !== undefined) base[k] = d[k];
      }
      if (d.adCounts) base.adCounts = d.adCounts;
      if (d.inventory) base.inventory = d.inventory;
    } catch (e) {
      console.warn('loadState parse failed', e);
    }
  }
  S = base;
}

function resetState() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) {
    console.warn('resetState failed', e);
  }
  location.reload();
}

function refreshDay() {
  var today = dayKeyStr(new Date());
  if (S.day !== today) {
    S.day = today;
    S.dayEarned = 0;
    S.daySpent = 0;
    S.adCounts = { reroll: 0, gap: 0, pack: 0, offline: 0 };
    S.shareCount = 0;
    S.fakeCountToday = 0;
    S.questAmethyst = 0;
    S.questDrill = 0;
    S.questVein = 0;
    S.chestClaimed = false;
  }
  if (!S.firstPlayDate) S.firstPlayDate = today;
}

function playDays() {
  if (!S.firstPlayDate) return 1;
  var f = new Date(S.firstPlayDate);
  var now = new Date();
  var diff = Math.floor((now - f) / 86400000);
  return diff + 1;
}

/* ================= 音频 ================= */
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.warn('AudioContext unavailable', e);
  }
}

function playTone(freq, dur, type, vol) {
  if (!audioCtx || muted) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {
    console.warn('playTone failed', e);
  }
}

function sndCoin() { playTone(880, 0.09, 'square', 0.06); playTone(1320, 0.12, 'square', 0.05); }
function sndFake() { playTone(120, 0.22, 'sawtooth', 0.1); playTone(70, 0.3, 'triangle', 0.12); }
function sndUpgrade() { playTone(660, 0.1, 'square', 0.07); playTone(990, 0.16, 'square', 0.07); }
function sndRare() { playTone(784, 0.12, 'sine', 0.09); playTone(988, 0.12, 'sine', 0.09); playTone(1319, 0.2, 'sine', 0.09); }
function sndMilestone() { playTone(523, 0.14, 'triangle', 0.1); playTone(659, 0.14, 'triangle', 0.1); playTone(784, 0.24, 'triangle', 0.1); }

/* ================= 粒子 ================= */
function flyCoin(el) {
  try {
    var r = el.getBoundingClientRect();
    var span = document.createElement('span');
    span.className = 'coin-fly';
    span.textContent = '🪙';
    span.style.left = (r.left + r.width / 2 - 10) + 'px';
    span.style.top = (r.top + r.height / 2 - 10) + 'px';
    document.body.appendChild(span);
    setTimeout(function () { span.remove(); }, 850);
  } catch (e) {
    console.warn('flyCoin failed', e);
  }
}

function floatText(x, y, txt, cls) {
  try {
    var span = document.createElement('span');
    span.className = 'gain-fly ' + (cls || 'gain-gold');
    span.textContent = txt;
    span.style.left = x + 'px';
    span.style.top = y + 'px';
    document.body.appendChild(span);
    setTimeout(function () { span.remove(); }, 1050);
  } catch (e) {
    console.warn('floatText failed', e);
  }
}

function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
}

/* ================= 矿层生成 ================= */
function rollRareKey() {
  var r = Math.random() * 100, acc = 0;
  var keys = ['amethyst', 'ruby', 'emerald', 'diamond'];
  for (var i = 0; i < keys.length; i++) {
    acc += RARES[keys[i]].weight;
    if (r < acc) return keys[i];
  }
  return 'amethyst';
}

function rollKind(cfg) {
  if (DBG.nextKind) {
    var k = DBG.nextKind;
    DBG.nextKind = null;
    return k;
  }
  if (S.pity >= 30) { S.pity = 0; return 'rare'; }
  var r = Math.random() * 100;
  if (r < cfg.rare) { S.pity = 0; return 'rare'; }
  S.pity++;
  if (r < cfg.rare + cfg.fake) return 'fake';
  if (r < cfg.rare + cfg.fake + cfg.cu) return 'copper';
  return 'iron';
}

function oreHp(kind) {
  if (kind === 'iron') return 3;
  if (kind === 'rare') return 5;
  return 1;
}

function rollOre(kind, isLast) {
  var cfg = layerConfig(S.mineLevel);
  if (!kind) {
    if (isLast) {
      kind = (Math.random() < 0.5) ? 'fake' : rollKind(cfg);
    } else {
      kind = rollKind(cfg);
    }
  }
  if (kind === 'rare') S.pity = 0;
  oreSeq++;
  return { id: oreSeq, kind: kind, hp: oreHp(kind), maxHp: oreHp(kind), last: !!isLast, rareKey: kind === 'rare' ? rollRareKey() : null };
}

function spawnLayer(depth) {
  var cfg = layerConfig(depth);
  var ores = [];
  if (cfg.infinite) {
    for (var i = 0; i < cfg.ores; i++) ores.push(rollOre('copper'));
  } else {
    for (var j = 0; j < cfg.ores; j++) ores.push(rollOre(null, false));
    ores[ores.length - 1] = rollOre(null, true);
  }
  S.layer = { depth: depth, ores: ores };
}

function refillBatch() {
  if (!S.layer) return;
  var cfg = layerConfig(S.layer.depth);
  if (!cfg.infinite) return;
  var n = cfg.ores;
  for (var i = 0; i < n; i++) S.layer.ores.push(rollOre('copper'));
}

function remainingCount() {
  if (!S.layer) return 0;
  return S.layer.ores.length;
}

/* ================= 主流程 ================= */
function gainCoins(n, opts) {
  opts = opts || {};
  var isEarn = opts.earn !== false;
  var isSpend = !!opts.spend;
  if (isEarn) S.dayEarned += n;
  if (isSpend) S.daySpent += n;
  if (isEarn) S.careerEarned += n;
  if (isSpend) S.careerSpent += n;
  S.coins += n;
  checkTarget();
  renderHeader();
}

function gainXP(n) {
  S.xp += n;
  checkMilestone();
  renderLayerbar();
}

function checkTarget() {
  if (curTargetIdx >= TARGETS.length) return;
  var t = TARGETS[curTargetIdx];
  if (S.dayEarned >= t.need && S.dayTargetClaimed.indexOf(curTargetIdx) < 0) {
    S.dayTargetClaimed.push(curTargetIdx);
    gainCoins(t.reward);
    toast('🎯 今日目标完成！奖励 ' + t.reward + ' 金币');
    curTargetIdx = TARGETS.length;
    for (var i = 0; i < TARGETS.length; i++) {
      if (S.dayEarned < TARGETS[i].need) { curTargetIdx = i; break; }
    }
  }
}

function checkMilestone() {
  var target = null;
  for (var i = 0; i < LAYERS.length; i++) {
    if (LAYERS[i].xpNeed <= S.xp && LAYERS[i].depth > S.mineLevel) { target = LAYERS[i]; break; }
  }
  if (target) showMilestone(target);
}

function showMilestone(cfg) {
  gameState = 'paused';
  S.mineLevel = cfg.depth;
  var unlockNote = '';
  if (cfg.depth === 2) unlockNote = '开启有限矿脉，小心「假矿」！';
  if (cfg.depth === 3) unlockNote = '解锁限时稀有矿脉事件！';
  if (cfg.depth === 4) unlockNote = '矿层更深，稀有矿更多！';
  $('ms-text').textContent = '矿场等级提升到 ' + cfg.depth + ' 层 · ' + cfg.name + (unlockNote ? '\n' + unlockNote : '');
  $('ms-reward').textContent = '扩建奖励 +' + cfg.reward + ' 金币';
  if (cfg.reward > 0) gainCoins(cfg.reward);
  sndMilestone();
  showPanel('milestone');
  if (S.guideDone && S.mineLevel >= 3 && !S.veinUnlockSeen) {
    S.veinUnlockSeen = true;
    scheduleVein();
  }
}

function completeMilestone() {
  closePanel();
  gameState = 'playing';
  spawnLayer(S.mineLevel);
  renderGrid();
  renderHeader();
  renderLayerbar();
  renderUpgrades();
}

/* ================= 挖矿交互 ================= */
function tapOre(idx) {
  if (gameState !== 'playing') return;
  if (!S.layer) return;
  var ores = S.layer.ores;
  if (idx < 0 || idx >= ores.length) return;
  var ore = ores[idx];
  if (ore.hp <= 0) return;
  if (DBG.nextKind) {
    var fk = DBG.nextKind;
    DBG.nextKind = null;
    if (fk.indexOf('rare:') === 0) {
      ore.kind = 'rare';
      ore.rareKey = fk.slice(5);
    } else {
      ore.kind = fk;
      ore.rareKey = (ore.kind === 'rare') ? rollRareKey() : null;
    }
    ore.maxHp = oreHp(ore.kind);
    ore.hp = ore.maxHp;
  }
  var cell = document.querySelector('.ore[data-idx="' + idx + '"]');
  var drill = S.drillLv;
  ore.hp -= drill;
  if (cell) {
    cell.classList.remove('wobble');
    void cell.offsetWidth;
    cell.classList.add('wobble');
  }
  if (ore.hp <= 0) {
    completeOre(idx, ore, cell);
  } else {
    if (cell) {
      var bar = cell.querySelector('.hpbar i');
      if (bar) bar.style.width = Math.max(0, ore.hp / ore.maxHp * 100) + '%';
    }
    sndCoin();
  }
}

function completeOre(idx, ore, cell) {
  var ores = S.layer.ores;
  var x = 0, y = 0;
  if (cell) {
    var r = cell.getBoundingClientRect();
    x = r.left + r.width / 2;
    y = r.top + r.height / 2;
  }
  if (ore.kind === 'fake') {
    S.fakeCountToday++;
    if (cell) {
      cell.classList.add('shatter');
      setTimeout(function () { cell.remove(); }, 460);
    }
    sndFake();
    floatText(x, y, '-1 🪙', 'gain-red');
    gainCoins(-1);
    ores.splice(idx, 1);
    if (ores.length === 0) {
      onLayerDepleted();
    } else {
      setTimeout(function () { onFakeHit(idx); }, 900);
    }
    renderGrid();
    return;
  }
  if (cell) {
    cell.classList.add('spark');
    cell.classList.add('fadeout');
    setTimeout(function () { cell.remove(); }, 500);
  }
  if (ore.kind === 'copper') {
    flyCoin(cell);
    sndCoin();
    floatText(x, y, '+1 🪙', 'gain-gold');
    gainCoins(1);
    gainXP(1);
  } else if (ore.kind === 'iron') {
    flyCoin(cell);
    sndCoin();
    floatText(x, y, '+5 🪙', 'gain-gold');
    gainCoins(5);
    gainXP(3);
  } else if (ore.kind === 'rare') {
    sndRare();
    floatText(x, y, '+' + RARES[ore.rareKey].value + ' 🪙 ' + RARES[ore.rareKey].ico, 'gain-blue');
    collectRare(ore.rareKey, RARES[ore.rareKey].value, cell);
    gainXP(10);
  }
  ores.splice(idx, 1);
  if (S.guideDone && S.mineLevel >= 3 && !S.veinUnlockSeen) {
    S.veinUnlockSeen = true;
    scheduleVein();
  }
  renderGrid();
  renderHeader();
  renderLayerbar();
  onGuideOreTap();
}

function onGuideOreTap() {
  if (S.guideDone) return;
  if (S.guideStepDone === 0) {
    S.guideStepDone = 1;
    renderGuide(2);
  } else if (S.guideStepDone === 2) {
    S.guideStepDone = 3;
    finishGuide();
  }
}

function collectRare(key, value, cell) {
  var used = 0;
  for (var k in S.inventory) used += S.inventory[k];
  gainCoins(value);
  if (used < S.packSlots) {
    S.inventory[key]++;
    if (key === 'amethyst') S.questAmethyst++;
    toast('💎 发现稀有矿脉！' + RARES[key].name + ' 已收入背包');
  } else {
    curPackKey = key;
    $('pf-text').textContent = '背包已满，' + RARES[key].name + ' ' + RARES[key].ico + ' 掉在地上。扩容后可拾取。';
    gameState = 'paused';
    showPanel('packfull');
    sndRare();
  }
}

function onFakeHit(idx) {
  if (gameState !== 'playing') return;
  var rerollFree = S.fakeCountToday <= 3;
  curFakeOreIdx = idx;
  var btn = $('rerollBtn');
  btn.textContent = rerollFree ? '🔄 重新勘探' : '📺 看广告重新勘探';
  btn.dataset.act = rerollFree ? 'reroll-free' : 'reroll-ad';
  showPanel('fake');
  gameState = 'paused';
}

function doReroll(useAd) {
  var idx = curFakeOreIdx;
  closePanel();
  gameState = 'playing';
  if (!S.layer) return;
  var ores = S.layer.ores;
  if (idx >= ores.length) { renderGrid(); return; }
  function regen() {
    var kind = DBG.nextKind;
    DBG.nextKind = null;
    if (!kind) kind = (Math.random() < 0.5) ? 'iron' : 'fake';
    ores.splice(idx, 1, rollOre(kind, false));
    if (kind === 'fake') toast('这次还是废矿…再试试别的？');
    else toast('🪨 重新勘探成功！');
    renderGrid();
  }
  if (useAd) {
    showAd('reroll', regen);
  } else {
    regen();
  }
}

function onLayerDepleted() {
  var cfg = layerConfig(S.mineLevel);
  if (cfg.infinite) {
    setTimeout(function () {
      if (!S.layer) return;
      refillBatch();
      renderGrid();
    }, 700);
    return;
  }
  var gap = nextUpgradeCost();
  var short = gap > 0 ? gap - S.coins : 0;
  if (gap > 0 && short > 0 && short <= 5 && S.adCounts.gap < 8) {
    $('gap-text').textContent = '距升级还差 ' + short + ' 金币';
    $('gapAdBtn').textContent = '📺 看广告获得 ' + (short + 1) + ' 金币 🪙';
    showPanel('gap');
  } else {
    showPanel('depleted');
  }
  gameState = 'paused';
  sndFake();
}

function doGapAd() {
  var gap = nextUpgradeCost();
  var short = gap > 0 ? gap - S.coins : 0;
  if (short <= 0) { showPanel('depleted'); return; }
  showAd('gap', function () {
    gainCoins(short + 1);
    $('gap-text').textContent = '已获得 ' + (short + 1) + ' 金币，去升级吧！';
    $('gapAdBtn').classList.add('hidden');
    showPanel('gap');
    gameState = 'paused';
    toast('🪙 距离升级只差一步！');
    sndUpgrade();
  });
}

function restartLayer() {
  closePanel();
  gameState = 'playing';
  spawnLayer(S.mineLevel);
  renderGrid();
  renderHeader();
  renderLayerbar();
}

/* ================= 升级 ================= */
function buyDrill() {
  if (gameState !== 'playing') return;
  var cost = nextDrillCost();
  if (cost < 0 || S.coins < cost) return;
  gainCoins(-cost, { spend: true });
  S.drillLv++;
  S.questDrill = Math.min(2, S.questDrill + 1);
  sndUpgrade();
  toast('⛏️ 钻头升级到 ' + S.drillLv + ' 级！点击力 ' + S.drillLv);
  if (!S.guideDone && S.guideStepDone === 1) {
    S.guideStepDone = 2;
    renderGuide(3);
  }
  renderUpgrades();
  renderHeader();
}

function buyMiner() {
  if (gameState !== 'playing') return;
  var cost = nextMinerCost();
  if (cost < 0 || S.coins < cost) return;
  gainCoins(-cost, { spend: true });
  S.minerLv++;
  sndUpgrade();
  toast('🤖 自动矿工就位！每秒 +' + MINER_RATES[S.minerLv - 1] + ' 金币');
  renderUpgrades();
  renderHeader();
}

function minerPulse() {
  if (gameState !== 'playing') return;
  if (!S.minerLv) return;
  S.coins += MINER_RATES[S.minerLv - 1];
  S.dayEarned += MINER_RATES[S.minerLv - 1];
  S.careerEarned += MINER_RATES[S.minerLv - 1];
  checkTarget();
  renderHeader();
}

/* ================= 渲染 ================= */
function renderHeader() {
  var c = $('coins');
  c.childNodes[0].nodeValue = fmtNum(S.coins) + ' ';
  var gap = nextUpgradeCost();
  var near = gap > 0 && S.coins >= gap - 2 && S.coins < gap;
  c.classList.toggle('pulse', near);
  var net = S.dayEarned - S.daySpent;
  var chip = $('netchip');
  chip.textContent = '今日 ' + (net >= 0 ? '+' : '') + fmtNum(net);
  chip.classList.toggle('neg', net < 0);
  $('daychip').textContent = '第' + playDays() + '天';
  if (near) {
    var short = gap - S.coins;
    if (c.dataset.hint !== String(short)) {
      c.dataset.hint = String(short);
    }
  } else {
    c.dataset.hint = '';
  }
}

function renderLayerbar() {
  var cfg = layerConfig(S.mineLevel);
  $('lvname').textContent = S.mineLevel + '层 · ' + cfg.name;
  var nextNeed = 0;
  for (var i = 0; i < LAYERS.length; i++) {
    if (LAYERS[i].xpNeed > S.xp) { nextNeed = LAYERS[i].xpNeed; break; }
  }
  if (!nextNeed) nextNeed = S.xp;
  var prevNeed = 0;
  for (var j = 0; j < LAYERS.length; j++) {
    if (LAYERS[j].xpNeed <= S.xp) prevNeed = LAYERS[j].xpNeed;
  }
  var pct = Math.min(100, (S.xp - prevNeed) / Math.max(1, nextNeed - prevNeed) * 100);
  $('xpfill').style.width = pct + '%';
  $('xptext').textContent = S.xp + '/' + nextNeed;
  var rem = remainingCount();
  if (cfg.infinite) {
    $('remaining').textContent = '';
  } else {
    $('remaining').textContent = '剩 ' + rem + ' 块';
  }
}

function oreCell(ore, idx) {
  var b = document.createElement('button');
  b.className = 'ore ore-' + ore.kind;
  b.dataset.ore = '1';
  b.dataset.idx = String(idx);
  b.dataset.oreKind = ore.kind;
  if (ore.last) b.dataset.lastOre = '1';
  var gem = document.createElement('span');
  gem.className = 'gem';
  if (ore.kind === 'rare' && ore.rareKey) gem.textContent = RARES[ore.rareKey].ico;
  else gem.textContent = ore.kind === 'fake' ? '🪨' : '';
  b.appendChild(gem);
  if (ore.maxHp > 1) {
    var hb = document.createElement('span');
    hb.className = 'hpbar';
    var fi = document.createElement('i');
    fi.style.width = (ore.hp / ore.maxHp * 100) + '%';
    hb.appendChild(fi);
    b.appendChild(hb);
  }
  if (ore.last) {
    var q = document.createElement('span');
    q.className = 'qmark';
    q.textContent = '？';
    b.appendChild(q);
  }
  b.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    initAudio();
    var i = parseInt(b.dataset.idx, 10);
    tapOre(i);
  });
  return b;
}

function renderGrid() {
  var g = $('grid');
  g.innerHTML = '';
  if (!S.layer) return;
  var ores = S.layer.ores;
  for (var i = 0; i < ores.length; i++) {
    g.appendChild(oreCell(ores[i], i));
  }
}

function renderUpgrades() {
  var dCost = nextDrillCost();
  var mCost = nextMinerCost();
  var dc = $('drillcard');
  if (dCost < 0) {
    dc.classList.add('disabled');

  } else {
    dc.classList.toggle('disabled', S.coins < dCost);
    $('drillcost').innerHTML = '<span class="ico">🪙</span> ' + dCost;
    var short = dCost - S.coins;
    if (short > 0) $('drilldesc').textContent = '点击力 ' + S.drillLv + ' → ' + (S.drillLv + 1) + ' · 还差 ' + short;
    else $('drilldesc').textContent = '点击力 ' + S.drillLv + ' → ' + (S.drillLv + 1);
  }
  $('drilllv').textContent = S.drillLv + '级';
  var mc = $('minercard');
  if (S.mineLevel < 2) {
    mc.classList.add('locked');
    $('minerlv').textContent = '未解锁';
    $('minerdesc').textContent = '扩建矿场后解锁';
    $('minercost').textContent = '🔒';
  } else if (mCost < 0) {
    mc.classList.add('disabled');
    $('minerlv').textContent = S.minerLv + '级';
    $('minercost').innerHTML = '<span class="upflag">已满级</span>';

    mc.classList.remove('locked');
    mc.classList.toggle('disabled', S.coins < mCost);
    $('minerlv').textContent = S.minerLv + '级';
    $('minerdesc').textContent = '每秒 +' + MINER_RATES[S.minerLv - 1] + ' 金币';

/* ================= 面板 ================= */
function showPanel(name) {
  $('mask').classList.add('show');
  var panels = document.querySelectorAll('.panel');
  for (var i = 0; i < panels.length; i++) {
    panels[i].classList.toggle('active', panels[i].dataset.panel === name);
  }
  if (!S.guideDone) $('guide').classList.add('hidden');
}

function closePanel() {
  $('mask').classList.remove('show');
  var panels = document.querySelectorAll('.panel');
  for (var i = 0; i < panels.length; i++) panels[i].classList.remove('active');
  if (!S.guideDone && S.guideCurStep) renderGuide(S.guideCurStep);
}

/* ================= 广告模拟 ================= */
function showAd(slot, onDone) {
  showPanel('ad');
  gameState = 'paused';
  S.adCounts[slot]++;
  var left = AD_MS / 1000;
  var claim = $('adClaim');
  claim.disabled = true;
  var countEl = $('adCount');
  function finish() {
    if (adTimer) clearInterval(adTimer);
    adTimer = null;
    countEl.textContent = '✓';
    claim.disabled = false;
    claim.dataset.slot = slot;
    claim.onclick = function () {
      closePanel();
      gameState = 'playing';
      var cb = claim._cb || function () {};
      claim._cb = null;
      claim.onclick = null;
      claim.disabled = true;
      cb();
    };
    claim._cb = onDone;
    saveState();
  }
  countEl.textContent = String(Math.ceil(left));
  adTimer = setInterval(function () {
    left -= 0.25;
    if (left <= 0) { finish(); }
    else countEl.textContent = String(Math.ceil(left));
  }, 250);
}

/* ================= 引导 ================= */
var guideStepEls = null;

function renderGuide(step) {
  var g = $('guide');
  if (step < 1 || step > 3) { g.classList.add('hidden'); return; }
  var info = GUIDE_STEPS[step - 1];
  g.querySelector('[data-guide-step]').textContent = info.txt;
  $('guidehint').textContent = info.hint;
  g.classList.remove('hidden');
  g.dataset.guideStep = String(step);
  S.guideCurStep = step;
  var next = g.querySelector('[data-act="guide-next"]');
  if (next) next.classList.toggle('hidden', step !== 1);
}

function startGuide() {
  S.guideStepDone = 0;
  renderGuide(1);
}

function finishGuide() {
  S.guideDone = true;
  $('guide').classList.add('hidden');
  toast('🎉 准备好了！小心假矿，继续挖吧');
}

function advanceGuide() {
  var step = parseInt($('guide').dataset.guideStep || '1', 10);
  if (step === 1) {
    S.guideStepDone = 2;
    renderGuide(2);

/* ================= 限时矿脉事件 ================= */
function scheduleVein() {
  if (veinScheduler) return;
  veinScheduler = setInterval(function () {
    if (gameState !== 'playing') return;
    if (S.veinActive) return;
    spawnVein();
  }, 180000);
}

function spawnVein() {
  if (S.veinActive) return;
  var r = Math.random() * 100, acc = 0;
  var keys = ['amethyst', 'ruby', 'emerald', 'diamond'];
  var chosen = 'amethyst';
  for (var i = 0; i < keys.length; i++) {
    acc += RARES[keys[i]].weight;
    if (r < acc) { chosen = keys[i]; break; }
  }
  S.veinActive = { key: chosen, timeLeft: 60, ores: [1, 1, 1, 1, 1] };
  toast('✨ 限时稀有矿脉出现！' + RARES[chosen].name + ' 60 秒后消失');
  sndRare();
  renderVein();
  if (veinTimer) clearInterval(veinTimer);
  veinTimer = setInterval(veinTick, 1000);
}

function veinTick() {
  if (!S.veinActive) return;
  S.veinActive.timeLeft--;
  if (S.veinActive.timeLeft <= 0) {
    S.veinActive = null;
    $('veinstrip').classList.add('hidden');
    toast('💨 限时矿脉消失了…明日再来蹲守');
    if (veinTimer) { clearInterval(veinTimer); veinTimer = null; }
    return;
  }
  $('veincount').textContent = S.veinActive.timeLeft + 's';
}

function renderVein() {
  if (!S.veinActive) { $('veinstrip').classList.add('hidden'); return; }
  var strip = $('veinstrip');
  strip.classList.remove('hidden');
  var g = $('veingrid');
  g.innerHTML = '';
  for (var i = 0; i < S.veinActive.ores.length; i++) {
    var b = document.createElement('button');
    b.className = 'ore ore-rare';
    b.dataset.veinOre = String(i);
    var gem = document.createElement('span');
    gem.className = 'gem';
    gem.textContent = RARES[S.veinActive.key].ico;
    b.appendChild(gem);
    b.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      initAudio();
      mineVeinOre(parseInt(this.dataset.veinOre, 10), this);
    });
    g.appendChild(b);
  }
}

function mineVeinOre(i, cell) {
  if (gameState !== 'playing') return;
  if (!S.veinActive) return;
  if (cell) cell.remove();
  S.veinActive.ores.splice(i, 1);
  var key = S.veinActive.key;
  sndRare();
  var x = 0, y = 0;
  if (cell) {
    var r = cell.getBoundingClientRect();
    x = r.left + r.width / 2;
    y = r.top + r.height / 2;
  }
  floatText(x, y, '+' + RARES[key].value + ' 🪙 ' + RARES[key].ico, 'gain-blue');
  collectRare(key, RARES[key].value, cell);
  gainXP(10);
  S.questVein = 1;
  if (S.veinActive.ores.length === 0) {
    S.veinActive = null;
    $('veinstrip').classList.add('hidden');
    if (veinTimer) { clearInterval(veinTimer); veinTimer = null; }
    toast('🎉 限时矿脉开采完毕！');
  }
}

/* ================= 离线收益 ================= */
function settleOffline() {
  var last = S.lastSeen;
  if (!last) return;
  var minutes = (Date.now() - last) / 60000;
  if (minutes < 1) return;
  var cap = Math.min(minutes, 480);
  var coef = S.mineLevel <= 1 ? 0.5 : 0.2;
  var rate = S.minerLv ? MINER_RATES[S.minerLv - 1] : 0;
  var base = rate * coef * cap;
  if (base <= 0) { S.lastSeen = Date.now(); return; }
  var h = Math.floor(minutes / 60), m = Math.floor(minutes % 60);
  var timeStr = h > 0 ? h + ' 小时 ' + m + ' 分' : m + ' 分钟';
  $('offline-amount').textContent = '+' + fmtNum(base) + ' 🪙';
  $('offline-time').textContent = '矿工们工作了 ' + timeStr + '（离线效率 ' + Math.round(coef * 100) + '%）';
  showPanel('offline');
  gameState = 'paused';
  pendingOfflineBonus = base;
  S.lastSeen = Date.now();
  saveState();
  var x2 = $('offlineX2');
  x2.classList.add('hidden');
  if (minutes >= 30 && S.adCounts.offline < 3) {
    setTimeout(function () {
      if (!x2.classList.contains('hidden')) return;
      if (document.querySelector('[data-panel="offline"]').classList.contains('active')) {
        x2.classList.remove('hidden');
      }
    }, 1500);
  }
}

function claimOfflineBase() {
  gainCoins(pendingOfflineBonus);
  pendingOfflineBonus = 0;
  closePanel();
  gameState = 'playing';
  toast('🪙 离线收益已到账');
}

function doOfflineX2() {
  var base = pendingOfflineBonus;
  showAd('offline', function () {
    var total = base + pendingOfflineBonus;
    pendingOfflineBonus = 0;
    gainCoins(total);
    toast('📺 收益翻倍！共 +' + fmtNum(total) + ' 金币');
    $('offlineX2').classList.add('hidden');
    closePanel();
    gameState = 'playing';
  });
}

  $('sc-asset').textContent = fmtNum(playerAsset());
  $('sc-net').textContent = (playerNet() >= 0 ? '+' : '') + fmtNum(playerNet());
  $('sc-gems').textContent = packUsed() + ' 件';
  $('sc-copy').textContent = '我的第 ' + playDays() + ' 天矿场刚开出稀有水晶，你的矿场还只有几座——但今天开始还不算晚。';
  var left = Math.max(0, 3 - S.shareCount);
  $('share-reward').textContent = left > 0 ? '今日还可分享 ' + left + ' 次，每次 +20 金币' : '今日分享次数已达上限';
  showPanel('share');
}

function doShare() {
  if (S.shareCount >= 3) {
    toast('今日分享次数已达上限');
    return;
  }
  S.shareCount++;
  gainCoins(20);
  var text = '无尽矿脉战绩卡：第' + playDays() + '天 · ' + S.mineLevel + '层矿场 · 总资产' + fmtNum(playerAsset()) + ' · 今日净收益' + (playerNet() >= 0 ? '+' : '') + fmtNum(playerNet()) + ' —— 我的矿场刚开出稀有水晶，你的矿场还只有几座？';
  var done = function () { toast('📤 战绩卡已分享 +20 金币'); renderShareCard(); };
  if (navigator.share) {
    try {
      navigator.share({ title: '无尽矿脉战绩卡', text: text }).then(done, function () {
        toast('分享已取消');
      });
      return;
    } catch (e) {
      console.warn('navigator.share failed', e);
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { done(); });
    } else {
      done();
    }
  } catch (e) {
    console.warn('clipboard failed', e);
    done();
  }
}

/* ================= 主循环 ================= */
function update(now) {
  try {
    if (gameState !== 'playing') return;
    if (!_lastTime) _lastTime = now;
    var dt = now - _lastTime;
    _lastTime = now;
    if (dt < 0 || dt > 500) return;
    var c = $('coins');
    var gap = nextUpgradeCost();
    var near = gap > 0 && S.coins >= gap - 2 && S.coins < gap;
    if (c.classList.contains('pulse') !== near) {
      c.classList.toggle('pulse', near);
    }
  } catch (e) {
    console.warn('update failed', e);
  }
}

/* ================= 初始化 ================= */
function bindEvents() {
  document.addEventListener('pointerdown', initAudio, { once: true });

  $('mutebtn').addEventListener('click', function () {
    muted = !muted;
    $('mutebtn').textContent = muted ? '🔇' : '🔊';
  });

  $('resetbtn').addEventListener('click', function () {
    if (window.confirm('确定要清空存档重新开始吗？')) resetState();
  });

  $('drillcard').addEventListener('click', buyDrill);
  $('minercard').addEventListener('click', buyMiner);

  $('mask').addEventListener('click', function (ev) {
    if (ev.target === $('mask')) {
      closePanel();
      gameState = 'playing';
      return;
    }
    var act = ev.target.dataset ? ev.target.dataset.act : null;
    if (!act) return;
    if (act === 'milestone-continue') completeMilestone();
    else if (act === 'fake-dismiss') { closePanel(); gameState = 'playing'; }
    else if (act === 'reroll-free') doReroll(false);
    else if (act === 'reroll-ad') doReroll(true);
    else if (act === 'layer-restart') restartLayer();
    else if (act === 'gap-ad') doGapAd();
    else if (act === 'pack-decline') declinePack();
    else if (act === 'pack-ad') doPackAd();
    else if (act === 'offline-close') claimOfflineBase();
    else if (act === 'offline-x2') doOfflineX2();
    else if (act === 'ad-claim') { /* handled by showAd */ }
    else if (act === 'chest') claimChest();
    else if (act === 'tab-asset') { rankTab = 'asset'; reRenderRankTabs(); }
    else if (act === 'tab-net') { rankTab = 'net'; reRenderRankTabs(); }
    else if (act === 'share') doShare();
  });

  var tabs = { pack: renderPack, quest: renderQuests, rank: function () { renderRank(); } };
  document.querySelectorAll('#tabs .tab').forEach(function (b) {
    b.addEventListener('click', function () {
      var act = b.dataset.act;
      if (act === 'pack') { renderPack(); showPanel('pack'); }
      else if (act === 'quest') { renderQuests(); showPanel('quest'); }
      else if (act === 'rank') { renderRank(); showPanel('rank'); }
      else if (act === 'share-card') { renderShareCard(); }
    });
  });

  $('guide').addEventListener('click', function (ev) {
    var act = ev.target.dataset ? ev.target.dataset.act : null;
    if (act === 'guide-next') advanceGuide();
    else if (act === 'guide-skip') { finishGuide(); }
  });
}

function reRenderRankTabs() {
  var tabs = document.querySelectorAll('.ranktab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('on', tabs[i].dataset.act === ('tab-' + rankTab));
  }
  renderRank();
}

function bindDebugHooks() {
  if (!DEBUG) return;
  window.__MINE__ = {
    state: function () { return JSON.parse(JSON.stringify(S)); },
    setCoins: function (n) { S.coins = n; renderHeader(); renderUpgrades(); },
    setXP: function (n) { S.xp = n; renderLayerbar(); },
    setDrillLv: function (n) { S.drillLv = n; renderUpgrades(); },
    forceNext: function (k) { DBG.nextKind = k; },
    setFakeCount: function (n) { S.fakeCountToday = n; },
    trimLayer: function (n) {
      if (!S.layer) return;
      while (S.layer.ores.length > n) S.layer.ores.pop();
      if (S.layer.ores.length === 1) {
        S.layer.ores[0].last = true;
      }
      renderGrid(); renderLayerbar();
    },
    fillInventory: function () {
      S.inventory.amethyst = S.packSlots;
      renderPack();
    },
    simulateOffline: function (min) {
      DBG.skipSeen = true;
      S.lastSeen = Date.now() - min * 60000;
      saveState();
      location.reload();
    },
    forceEvent: function () { spawnVein(); },
    fastAds: function (on) { AD_MS = on ? 400 : 2500; },
    resetAll: function () { resetState(); }
  };
}

function initGame() {
  loadState();
  if (!S) S = defaultState();
  refreshDay();
  if (!S.layer) spawnLayer(S.mineLevel);
  curTargetIdx = 0;
  for (var i = 0; i < TARGETS.length; i++) {
    if (S.dayEarned < TARGETS[i].need) { curTargetIdx = i; break; }
  }
  renderHeader();
  renderLayerbar();
  renderGrid();
  renderUpgrades();
  bindEvents();
  bindDebugHooks();
  if (!S.guideDone) startGuide();
  settleOffline();
  requestAnimationFrame(update);
  minerTimer = setInterval(minerPulse, 1000);
  saveTimer = setInterval(touchSeen, 2000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) touchSeen();
  });
  window.addEventListener('beforeunload', touchSeen);
}

document.addEventListener('DOMContentLoaded', initGame);

})();
</script>
