<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>离谱卡牌 · 逆袭局</title>
    <style>
        /* ===== 核心布局 ===== */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#1a1e2e; font-family:system-ui,-apple-system,'PingFang SC',sans-serif; color:#e8eaf6; overflow:hidden; touch-action:none; }
        #app { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
        .screen.active { display:flex; }

        /* ===== 卡片区 ===== */
        .card-container { display:flex; gap:12px; margin:24px 0; perspective:600px; }
        .card { width:92px; height:132px; background:linear-gradient(145deg,#2a2f45,#1f2437); border-radius:12px; border:2px solid #3d4a6b; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:bold; box-shadow:0 8px 20px rgba(0,0,0,.5); transition:transform .2s, border-color .2s; }
        .card.selected { border-color:#ffb74d; transform:translateY(-8px); }
        .card .num { font-size:32px; color:#ffd54f; text-shadow:0 2px 4px rgba(0,0,0,.6); }
        .card .label { font-size:11px; color:#b0bec5; margin-top:4px; letter-spacing:1px; }

        /* ===== 按钮 ===== */
        .btn { background:linear-gradient(145deg,#ff8a65,#f4511e); border:none; color:#fff; font-size:18px; font-weight:bold; padding:12px 28px; border-radius:40px; cursor:pointer; box-shadow:0 6px 16px rgba(244,81,30,.4); transition:transform .15s, box-shadow .15s; }
        .btn:active { transform:scale(.95); box-shadow:0 2px 8px rgba(244,81,30,.4); }
        .btn.secondary { background:#37474f; box-shadow:0 4px 12px rgba(0,0,0,.3); }

        /* ===== 状态栏 ===== */
        .hud { display:flex; gap:16px; align-items:center; font-size:14px; color:#90a4ae; }
        .hud span { background:#232a3d; padding:4px 12px; border-radius:20px; }
        .hud .score { color:#ffd54f; font-weight:bold; }

        /* ===== 分享屏 ===== */
        .share-card { background:linear-gradient(145deg,#2e3350,#1f2336); border-radius:16px; padding:24px; text-align:center; width:280px; border:2px solid #ffb74d; }
        .share-card .title { font-size:22px; font-weight:bold; color:#ffd54f; margin-bottom:8px; }
        .share-card .stats { font-size:14px; color:#b0bec5; margin:8px 0; }
        .share-card .stats b { color:#fff; }

        /* ===== 广告占位 ===== */
        .ad-placeholder { width:280px; height:120px; background:#0d1117; border:2px dashed #3d4a6b; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#546e7a; font-size:13px; margin:16px auto; }

        /* ===== 倒计时 ===== */
        .timer-bar { width:200px; height:6px; background:#263043; border-radius:4px; margin-top:12px; overflow:hidden; }
        .timer-fill { height:100%; background:#ffb74d; width:100%; transition:width 1s linear; }
    </style>
</head>
<body>
<div id="app">

    <!-- ========== 游戏主屏 ========== -->
    <div id="game-screen" class="screen active">
        <div class="hud">
            <span>第 <span id="round-num">1</span>/5 局</span>
            <span>离谱值 <span id="absurd-value">0</span></span>
            <span class="score">最高 <span id="best-score">0</span></span>
        </div>
        <div id="card-container" class="card-container"></div>
        <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
            <button class="btn" id="draw-btn">🎴 抽 3 张</button>
            <button class="btn secondary" id="ad-draw-btn" style="display:none;">📺 看广告+1张</button>
            <button class="btn secondary" id="restart-btn">再来一局</button>
        </div>
        <div id="game-msg" style="margin-top:16px; font-size:15px; color:#ffcc80; min-height:24px; text-align:center;"></div>
    </div>

    <!-- ========== 结算屏 ========== -->
    <div id="result-screen" class="screen">
        <h2 style="font-size:26px; margin-bottom:8px;">🏆 结算</h2>
        <div style="font-size:18px; color:#ffd54f; margin:8px 0;" id="result-title"></div>
        <div style="font-size:14px; color:#b0bec5; margin:8px 0;" id="result-detail"></div>
        <div class="ad-placeholder" id="interstitial-ad" style="display:none;">🎬 插屏广告位 (每5局)</div>
        <button class="btn secondary" id="ad-reverse-btn" style="display:none;">🔥 看广告逆袭翻倍</button>
        <button class="btn" id="share-btn" style="margin-top:16px;">📤 分享战绩</button>
    </div>

    <!-- ========== 分享屏 ========== -->
    <div id="share-screen" class="screen">
        <div class="share-card">
            <div class="title">🤯 离谱卡牌</div>
            <div class="stats">本局离谱值 <b id="share-score">0</b></div>
            <div class="stats">历史最高 <b id="share-best">0</b></div>
            <div style="font-size:12px; color:#78909c; margin-top:8px;">⚡ 30秒内仅可分享1次</div>
        </div>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn" id="confirm-share-btn">✅ 确认分享</button>
            <button class="btn secondary" id="cancel-share-btn">返回</button>
        </div>
    </div>
</div>

<script>
(function(){
    'use strict';

    // ===== 卡牌库 (≥12张) =====
    const CARD_POOL = [
        { num: 1, label: '🐱 掉毛' },
        { num: 2, label: '🐶 拆家' },
        { num: 3, label: '🤖 宕机' },
        { num: 4, label: '🧟 丧尸' },
        { num: 5, label: '👻 幽灵' },
        { num: 6, label: '🦄 独角' },
        { num: 7, label: '🐉 喷火' },
        { num: 8, label: '🍕 榴莲' },
        { num: 9, label: '🧨 哑炮' },
        { num: 10, label: '🌋 火山' },
        { num: 11, label: '🛸 飞碟' },
        { num: 12, label: '🐊 鳄鱼' },
        { num: 13, label: '🧊 冻住' },
        { num: 14, label: '🔥 自燃' }
    ];

    // ===== 游戏状态 =====
    let currentRound = 1;        // 1-5
    const TOTAL_ROUNDS = 5;
    let selectedCards = [];      // 当前抽出的3张卡
    let absurdScore = 0;         // 当前累计离谱值
    let bestScore = 0;           // 最高分
    let lastShareTime = 0;       // 分享限频 (30s)
    let adCounter = 0;           // 插屏计数 (每5局)
    let audioCtx = null;         // WebAudio 延迟初始化
    let drawing = false;         // 抽卡判定进行中（防重复点击）
    let lastIsCounter = false;   // 最近一局是否逆袭（决定结算屏逆袭按钮）

    // ===== DOM 引用 =====
    const $ = (id) => document.getElementById(id);
    const gameScreen = $('game-screen');
    const resultScreen = $('result-screen');
    const shareScreen = $('share-screen');
    const cardContainer = $('card-container');
    const roundNumEl = $('round-num');
    const absurdValueEl = $('absurd-value');
    const bestScoreEl = $('best-score');
    const gameMsg = $('game-msg');
    const drawBtn = $('draw-btn');
    const adDrawBtn = $('ad-draw-btn');
    const adReverseBtn = $('ad-reverse-btn');
    const interstitialAd = $('interstitial-ad');
    const restartBtn = $('restart-btn');
    const resultTitle = $('result-title');
    const resultDetail = $('result-detail');
    const shareBtn = $('share-btn');
    const confirmShareBtn = $('confirm-share-btn');
    const cancelShareBtn = $('cancel-share-btn');
    const shareScoreEl = $('share-score');
    const shareBestEl = $('share-best');

    // ===== localStorage 读取 =====
    try { bestScore = parseInt(localStorage.getItem('absurd_best') || '0', 10) || 0; } catch(e) { bestScore = 0; }
    bestScoreEl.textContent = bestScore;

    // ===== 工具函数 =====
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 抽3张不重复��
    function drawCards() {
        const pool = shuffle([...CARD_POOL]);
        return pool.slice(0, 3).map(c => ({ ...c }));
    }

    // 离谱值判定算法: 3张卡的num乘积 + 随机加成
    function calcAbsurd(cards) {
        const product = cards.reduce((acc, c) => acc * c.num, 1);
        const bonus = Math.floor(Math.random() * 10); // 0-9随机
        return product + bonus;
    }

    // 15%逆袭概率 + 5局保底
    function isCounterAttack(round) {
        if (round >= 5) return true; // 第5局必逆袭
        return Math.random() < 0.15;
    }

    // 渲染卡牌
    function renderCards(cards, selectable = true) {
        cardContainer.innerHTML = '';
        selectedCards = cards;
        cards.forEach((card, idx) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<div class="num">${card.num}</div><div class="label">${card.label}</div>`;
            if (selectable) {
                el.addEventListener('click', () => {
                    // 简单选中效果 (演示)
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                    el.classList.add('selected');
                });
            }
            cardContainer.appendChild(el);
        });
    }

    // 更新HUD
    function updateHUD() {
        roundNumEl.textContent = currentRound;
        absurdValueEl.textContent = absurdScore;
        bestScoreEl.textContent = bestScore;
    }

    // ===== 核心游戏流程 =====
    function startRound() {
        if (currentRound > TOTAL_ROUNDS) {
            showResult();
            return;
        }
        drawBtn.disabled = false;
        const cards = drawCards();
        renderCards(cards, true);
        updateHUD();
        gameMsg.textContent = `第 ${currentRound} 局，点击「抽 3 张」继续`;
    }

    function handleDraw() {
        if (drawing) return;
        drawing = true;
        drawBtn.disabled = true;

        // 抽卡 & 判定（仅一次）
        adCounter++;
        const cards = drawCards();
        const score = calcAbsurd(cards);
        const isCounter = isCounterAttack(currentRound);
        lastIsCounter = isCounter;

        // 更新分数
        absurdScore += score;
        if (isCounter) {
            absurdScore = Math.floor(absurdScore * 1.5); // 逆袭加成
            gameMsg.textContent = `💥 逆袭! 离谱值x1.5! 本局+${score}`;
        } else {
            gameMsg.textContent = `本局离谱值 +${score}`;
        }

        // 渲染抽到的卡
        renderCards(cards, false);
        updateHUD();

        // 更新最高分
        if (absurdScore > bestScore) {
            bestScore = absurdScore;
            try { localStorage.setItem('absurd_best', String(bestScore)); } catch(e) {}
            bestScoreEl.textContent = bestScore;
        }

        // 下一局
        currentRound++;
        adDrawBtn.style.display = 'inline-block';
        drawing = false;
        proceedNextRound();
    }

    function proceedNextRound() {
        if (currentRound > TOTAL_ROUNDS) {
            showResult();
        } else {
            startRound();
        }
    }

    // ===== 结算 =====
    function showResult() {
        gameScreen.classList.remove('active');
        resultScreen.classList.add('active');
        resultTitle.textContent = `离谱值 ${absurdScore}`;
        resultDetail.textContent = `最高纪录 ${bestScore} · 共${TOTAL_ROUNDS}局`;
        // 更新分享数据
        shareScoreEl.textContent = absurdScore;
        shareBestEl.textContent = bestScore;
        // 插屏广告：每5局在结算屏显示一次（2秒后自动隐藏）
        if (adCounter % 5 === 0) {
            interstitialAd.style.display = 'flex';
            setTimeout(() => { interstitialAd.style.display = 'none'; }, 2000);
        } else {
            interstitialAd.style.display = 'none';
        }
        // 翻车逆转按钮：结算屏始终提供（免费游玩，广告驱动翻倍）
        // 注：第5局保底必逆袭，故不按"最近一局未逆袭"条件隐藏，否则入口永不出现
        adReverseBtn.style.display = 'inline-block';
        adDrawBtn.style.display = 'none';
    }

    // ===== 分享 (30秒限频) =====
    function handleShare() {
        const now = Date.now();
        if (now - lastShareTime < 30000) {
            alert('⏳ 分享太频繁，请30秒后再试');
            return;
        }
        // 模拟分享 (实际可调微信/抖音API)
        lastShareTime = now;
        // 切换到分享屏
        resultScreen.classList.remove('active');
        shareScreen.classList.add('active');
    }

    function confirmShare() {
        // 模拟分享成功
        alert('✅ 分享成功！');
        // 回主界面
        shareScreen.classList.remove('active');
        gameScreen.classList.add('active');
        resetGame();
    }

    function cancelShare() {
        shareScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    // ===== 激励视频（模拟）=====
    function watchAdExtraDraw() {
        if (drawing || currentRound > TOTAL_ROUNDS) return;
        alert('📺 广告播放中…（模拟，2秒后生效）');
        drawing = true;
        setTimeout(() => {
            const extra = drawCards()[0];
            const gain = calcAbsurd([extra]);
            absurdScore += gain;
            gameMsg.textContent = `📺 看广告+1张: 离谱值 +${gain}`;
            if (absurdScore > bestScore) {
                bestScore = absurdScore;
                try { localStorage.setItem('absurd_best', String(bestScore)); } catch(e) {}
            }
            updateHUD();
            adDrawBtn.style.display = 'none';
            drawing = false;
        }, 2000);
    }

    function watchAdReverse() {
        if (currentRound <= TOTAL_ROUNDS) { alert('本局尚未结束'); return; }
        alert('📺 广告播放中…（模拟，2秒后生效）');
        adReverseBtn.disabled = true;
        setTimeout(() => {
            absurdScore = Math.floor(absurdScore * 2);
            resultTitle.textContent = `离谱值 ${absurdScore}`;
            shareScoreEl.textContent = absurdScore;
            if (absurdScore > bestScore) {
                bestScore = absurdScore;
                try { localStorage.setItem('absurd_best', String(bestScore)); } catch(e) {}
            }
            updateHUD();
            resultDetail.textContent = `最高纪录 ${bestScore} · 共${TOTAL_ROUNDS}局`;
            adReverseBtn.style.display = 'none';
            adReverseBtn.disabled = false;
        }, 2000);
    }

    // ===== 再来一局 =====
    function resetGame() {
        currentRound = 1;
        absurdScore = 0;
        adCounter = 0;
        lastShareTime = 0;   // 修复 M-5: 再来一局后重置分享限频
        drawing = false;
        lastIsCounter = false;
        adDrawBtn.style.display = 'none';
        adReverseBtn.style.display = 'none';
        adReverseBtn.disabled = false;
        interstitialAd.style.display = 'none';
        drawBtn.disabled = false;
        resultScreen.classList.remove('active');
        shareScreen.classList.remove('active');
        gameScreen.classList.add('active');
        startRound();
    }

    // ===== WebAudio 音效 (首次点击初始化) =====
    function initAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // 播放一个简单提示音
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 660;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) { /* 静默失败 */ }
    }

    // ===== 事件绑定 =====
    drawBtn.addEventListener('click', () => {
        initAudio();
        handleDraw();
    });
    adDrawBtn.addEventListener('click', () => {
        initAudio();
        watchAdExtraDraw();
    });
    adReverseBtn.addEventListener('click', () => {
        initAudio();
        watchAdReverse();
    });
    restartBtn.addEventListener('click', () => {
        initAudio();
        resetGame();
    });
    shareBtn.addEventListener('click', handleShare);
    confirmShareBtn.addEventListener('click', confirmShare);
    cancelShareBtn.addEventListener('click', cancelShare);

    // ===== 初始化 =====
    function init() {
  let gameState = "playing";
        // 首次点击初始化音频 (全局)
        document.addEventListener('click', function once() {
            initAudio();
            document.removeEventListener('click', once);
        });
        startRound();
    }

    init();
})();
</script>
</body>
</html>
