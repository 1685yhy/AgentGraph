<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>PixelBead — 拼豆大师</title>
<style>
:root{--bg:#12121a;--surface:#1a1a26;--gold:#f6c94d;--accent:#58a6ff;--pink:#ff6b9d;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{height:100%;display:flex;flex-direction:column;align-items:center;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;overflow:hidden}
#hdr{width:100%;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6b6b7b;z-index:10;background:rgba(0,0,0,0.3)}
#hdr .logo{font-size:16px;font-weight:800;color:var(--pink);letter-spacing:-0.5px}
#hdr .row{display:flex;gap:12px;align-items:center}
#hdr b{color:var(--gold)}
#wrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:4px}
#bead-display{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--surface);border-radius:20px;border:1px solid rgba(255,255,255,0.06)}
#bead-display .bead{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);animation:beadBounce 0.7s ease-in-out infinite;box-shadow:0 0 12px currentColor}
@keyframes beadBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#bead-display .info{font-size:11px;color:#6b6b7b;line-height:1.3}
#bead-display .info .color-name{color:#fff;font-weight:700}
#board-area{position:relative}
canvas{display:block;touch-action:manipulation;border-radius:10px}
#hint{font-size:11px;color:#6b6b7b;text-align:center;min-height:16px;transition:color 0.3s}
#hint.error{color:#f85149}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.82);display:flex;justify-content:center;align-items:center;z-index:100;backdrop-filter:blur(4px)}
.ov{background:var(--surface);border-radius:var(--r);padding:22px;text-align:center;max-width:330px;width:90%;border:1px solid rgba(255,255,255,0.06);animation:popIn 0.3s ease-out;max-height:90vh;overflow-y:auto}
@keyframes popIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.ov h2{font-size:20px;font-weight:800;margin-bottom:4px}
.ov .btn{display:block;width:100%;padding:12px;margin:5px 0;border-radius:var(--r);border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:transform 0.15s}
.ov .btn:active{transform:scale(0.96)}
.btn.primary{background:var(--gold);color:#000}
.btn.ad{background:linear-gradient(135deg,#667eea,#764ba2);font-size:12px}
.btn.ghost{background:rgba(255,255,255,0.05);color:#6b6b7b;font-size:12px}
.hidden{display:none!important}
.pattern-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.pcard{width:68px;padding:6px 4px;border-radius:10px;border:2px solid rgba(255,255,255,0.06);cursor:pointer;text-align:center;transition:all 0.2s;background:var(--surface)}
.pcard:hover,.pcard.sel{border-color:var(--gold);background:rgba(246,201,77,0.08)}
.pcard .thumb{width:44px;height:44px;margin:0 auto 3px;image-rendering:pixelated;border-radius:4px}
.pcard .name{font-size:10px;color:#8b8b9b}
.pcard .stars{font-size:9px}
.pcard .done{font-size:9px;color:#3fb950}
.pcard.locked{opacity:0.35;pointer-events:none}
</style>
</head>
<body>
<div id="hdr">
  <div class="logo">📌 PixelBead</div>
  <div class="row">
    <span>❤️<b id="lives-display">3</b></span>
    <span>🎯<b id="progress">0/0</b></span>
    <span>⏱<b id="timer-display">0</b>s</span>
    <span>🏆<b id="coll-count">0</b></span>
    <span>📍<b id="prov-label">-</b></span>
  </div>
</div>
<div id="wrap">
  <div id="bead-display">
    <div class="bead" id="current-bead"></div>
    <div class="info">放置: <span class="color-name" id="color-name">—</span><br><span id="remaining">剩余 0 个</span></div>
  </div>
  <div id="board-area"><canvas id="gc"></canvas></div>
  <div id="hint">👆 点击棋盘上高亮位置放置珠子</div>
</div>
<div id="overlay" class="hidden"></div>

<script>
/* ═══════ PixelBead v2 ═══════
 * 完整流水线: research→ideate→validate→plan→design→develop→gate→fix→review→deliver
 * 拼豆像素画创作游戏 — 线下热点线上化 */

// ── Design System ──
const DS={colors:{bg:'#12121a',surface:'#1a1a26',gold:'#f6c94d',accent:'#58a6ff',pink:'#ff6b9d',muted:'#6b6b7b',success:'#3fb950',danger:'#f85149'},radius:12,easing:'cubic-bezier(0.16,1,0.3,1)'};

// ── Patterns ──
const PATTERNS=[
  {id:'heart',name:'爱心',emoji:'❤️',size:8,colors:['#ff4444','#ffffff'],data:['........','..xx..xx.','.xxxxxx.','xxxxxxxx','xxxxxxxx','.xxxxxx.','..xxxx..','...xx...'],diff:1},
  {id:'star',name:'星星',emoji:'⭐',size:8,colors:['#ffaa00','#ffffff'],data:['...xx...','..xxxx..','.x.xx.x.','xx....xx','xxxxxx..','.xxxxx.','..xxx..','.xx.xx.'],diff:1},
  {id:'cat',name:'猫咪',emoji:'🐱',size:10,colors:['#ff8844','#ffffff','#222222','#ffaaaa'],data:['....xx....','..x.xx.x..','.x......x.','x..x..x..x','x........x','x..x..x..x','.xx....xx.','..x.xx.x..','...xxxx...','....xx....'],diff:2},
  {id:'flower',name:'花花',emoji:'🌸',size:10,colors:['#ff6b9d','#ffcc00','#ffffff','#88cc44'],data:['....xx....','..x.xx.x..','.x......x.','x..xxxx..x','x...xx...x','x..xxxx..x','.x......x.','..x.xx.x..','...x..x...','....xx....'],diff:2},
  {id:'fox',name:'狐狸',emoji:'🦊',size:12,colors:['#ff6622','#ffffff','#222222','#ffcc88'],data:['....xxxx....','...x....x...','..x..xx..x..','.x..x..x..x.','x..x....x..x','x.........x','x..xxxxx..x','.x..x.x..x.','..x..x..x..','...x....x...','....xxxx....','............'],diff:3},
  {id:'castle',name:'城堡',emoji:'🏰',size:14,colors:['#8899aa','#445566','#ffcc00','#ffffff','#88bbee'],data:['......xx......','.....xxxx.....','....x....x....','...x..xx..x...','..x..x..x..x..','.x..x....x..x.','x..x......x..x','x..xxxxxxxx..x','x..x......x..x','.xx........xx.','..x..xxxx..x..','..x..x..x..x..','..x..x..x..x..','..xx......xx..'],diff:4}
];
const PROVINCES=['北京','上海','广东','浙江','江苏','四川','湖北','湖南','福建','山东','河南','河北','辽宁','陕西','重庆','其他'];

// ── State ──
let gameState='init',pattern=null,board=null,beadQueue=[],currentBead=null;
let lives=3,placed=0,totalBeads=0,timer=0,timerId=null;
let collection=[],province='',bestTime={},charmap=null; // char→colorIndex mapping (FIXED from v1 bug)

// ── Storage ──
function lsGet(k,d){try{const v=localStorage.getItem(k);return v!==null?v:d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// ── Audio ──
let _ctx=null;
function snd(f,d,t='sine',v=0.05){if(!_ctx)return;try{const o=_ctx.createOscillator(),g=_ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,_ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,_ctx.currentTime+d);o.connect(g);g.connect(_ctx.destination);o.start();o.stop(_ctx.currentTime+d)}catch(e){}}
function sfxPlace(){snd(660,0.06,'sine',0.04)}
function sfxWrong(){snd(100,0.25,'sawtooth',0.06)}
function sfxComplete(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,0.15,'sine',0.06),i*80))}
function ensureAudio(){if(!_ctx){try{_ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){_ctx=null}}if(_ctx&&_ctx.state==='suspended')try{_ctx.resume()}catch(e){}}

// ── Canvas ──
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
let cw,ch,cellSize,gridSize;
function resize(){if(!pattern)return;cw=Math.min(window.innerWidth-16,360);ch=cw;canvas.width=cw;canvas.height=ch;gridSize=pattern.size;cellSize=cw/gridSize}
window.addEventListener('resize',()=>{resize();draw()});

// ── Load Pattern (FIXED: cache char→color mapping) ──
function loadPattern(idx){
  pattern=PATTERNS[idx];board=[];beadQueue=[];placed=0;lives=3;timer=0;currentBead=null;
  if(timerId)clearInterval(timerId);resize();

  // Build FIXED char→color mapping (v1 bug: rebuilt every click)
  charmaps={};let nextColor=0;
  for(let r=0;r<pattern.size;r++){
    board[r]=[];
    for(let c=0;c<pattern.size;c++){
      const ch=pattern.data[r][c];
      if(ch==='.'){board[r][c]=null;continue}
      if(!(ch in charmaps))charmaps[ch]=nextColor++;
      board[r][c]=null; // not placed yet
      beadQueue.push({r,c,color:charmaps[ch],ch});
    }
  }
  totalBeads=beadQueue.length;
  // Shuffle
  for(let i=beadQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[beadQueue[i],beadQueue[j]]=[beadQueue[j],beadQueue[i]]}
  nextBead();
  timerId=setInterval(()=>{timer++;updateUI()},1000);
  updateUI();draw();
}

function nextBead(){
  if(beadQueue.length===0){currentBead=null;updateBeadDisplay();return}
  currentBead=beadQueue.shift();
  updateBeadDisplay();draw();
}
function updateBeadDisplay(){
  const el=document.getElementById('current-bead');
  const nameEl=document.getElementById('color-name');
  const remEl=document.getElementById('remaining');
  if(currentBead){
    const col=pattern.colors[currentBead.color];
    el.style.background=col;el.style.boxShadow=`0 0 14px ${col}`;
    nameEl.textContent=col;nameEl.style.color=col;
    remEl.textContent=`剩余 ${beadQueue.length+1} 个`;
  }else{
    el.style.background='transparent';el.style.boxShadow='none';
    nameEl.textContent='完成!';remEl.textContent='';
  }
}

// ── Draw ──
function draw(){
  if(!pattern)return;
  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle=DS.colors.bg;ctx.fillRect(0,0,cw,ch);
  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=0.5;
  for(let i=0;i<=gridSize;i++){ctx.beginPath();ctx.moveTo(i*cellSize,0);ctx.lineTo(i*cellSize,ch);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cellSize);ctx.lineTo(cw,i*cellSize);ctx.stroke()}
  // Placed beads
  for(let r=0;r<gridSize;r++){
    for(let c=0;c<gridSize;c++){
      if(board[r][c]===null)continue;
      const col=pattern.colors[board[r][c]],x=c*cellSize+cellSize/2,y=r*cellSize+cellSize/2,radius=cellSize*0.38;
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.arc(x+1.5,y+1.5,radius,0,Math.PI*2);ctx.fill();
      const grad=ctx.createRadialGradient(x-1.5,y-2,0,x,y,radius);
      grad.addColorStop(0,lighten(col,50));grad.addColorStop(0.5,col);grad.addColorStop(1,darken(col,25));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(x-2,y-2.5,radius*0.25,0,Math.PI*2);ctx.fill();
    }
  }
  // Valid positions for current bead (glowing dots)
  if(currentBead&&gameState==='playing'){
    const targets=beadQueue.filter(b=>b.color===currentBead.color&&board[b.r][b.c]===null);
    targets.unshift(currentBead); // include current
    for(const t of targets){
      if(board[t.r][t.c]!==null)continue;
      const x=t.c*cellSize+cellSize/2,y=t.r*cellSize+cellSize/2;
      ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(x,y,cellSize*0.28,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([2,2]);
      ctx.beginPath();ctx.arc(x,y,cellSize*0.35,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
  }
}
function lighten(h,p){const n=parseInt(h.slice(1),16);return`rgb(${Math.min(255,(n>>16)+p)},${Math.min(255,((n>>8)&0xff)+p)},${Math.min(255,(n&0xff)+p)})`}
function darken(h,p){const n=parseInt(h.slice(1),16);return`rgb(${Math.max(0,(n>>16)-p)},${Math.max(0,((n>>8)&0xff)-p)},${Math.max(0,(n&0xff)-p)})`}

// ── Input (FIXED: use cached charmap, not recalculating) ──
canvas.addEventListener('click',e=>{
  if(gameState!=='playing'||!currentBead)return;ensureAudio();
  const r=canvas.getBoundingClientRect(),col=Math.floor((e.clientX-r.left)/cellSize),row=Math.floor((e.clientY-r.top)/cellSize);
  if(col<0||col>=gridSize||row<0||row>=gridSize)return;
  if(board[row][col]!==null)return; // already placed
  const ch=pattern.data[row][col];
  if(ch==='.')return; // not a bead position on pattern

  // Use FIXED charmap (v1 bug: recalculated on every click, causing wrong color matching)
  const expectedColor=charmaps[ch];
  if(expectedColor===currentBead.color){
    // CORRECT!
    board[row][col]=currentBead.color;placed++;sfxPlace();
    updateUI();draw();
    if(beadQueue.length===0&&board.flat().every((v,i)=>{const rr=Math.floor(i/gridSize),cc=i%gridSize;return pattern.data[rr][cc]==='.'||v!==null})){
      completePattern();
    }else{nextBead()}
  }else{
    // WRONG color
    lives--;sfxWrong();updateUI();draw();
    const hint=document.getElementById('hint');hint.textContent=`❌ 颜色不对！需要 ${pattern.colors[currentBead.color]}`;hint.classList.add('error');
    setTimeout(()=>{hint.textContent='👆 点击棋盘上高亮位置放置珠子';hint.classList.remove('error')},1200);
    if(lives<=0)endGame();
  }
});

// ── Complete / End ──
function completePattern(){
  gameState='won';sfxComplete();if(timerId)clearInterval(timerId);
  collection.push(pattern.id);lsSet('pb_coll',JSON.stringify(collection));
  if(!bestTime[pattern.id]||timer<bestTime[pattern.id]){bestTime[pattern.id]=timer;lsSet('pb_times',JSON.stringify(bestTime))}
  updateUI();
  // Celebration animation
  for(let i=0;i<5;i++)setTimeout(()=>{canvas.style.transform='scale('+(1+0.02*(5-i))+')';setTimeout(()=>canvas.style.transform='scale(1)',100)},i*120);
  setTimeout(showWin,700);
}
function endGame(){
  gameState='lost';if(timerId)clearInterval(timerId);sfxWrong();updateUI();
  setTimeout(showLose,400);
}

// ── UI ──
function updateUI(){
  document.getElementById('lives-display').textContent='❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));
  document.getElementById('progress').textContent=placed+'/'+totalBeads;
  document.getElementById('timer-display').textContent=timer;
  document.getElementById('coll-count').textContent=collection.length;
  document.getElementById('prov-label').textContent=province||'-';
}

// ── Overlays ──
function showWin(){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="ov"><h2>🎨 拼豆完成!</h2>
    <canvas id="prev" width="140" height="140" style="image-rendering:pixelated;margin:10px auto;display:block;border-radius:8px"></canvas>
    <p style="font-size:18px;font-weight:800">${pattern.emoji} ${pattern.name}</p>
    <div style="display:flex;justify-content:center;gap:16px;font-size:12px;color:#6b6b7b;margin:4px 0"><div>⏱<b style="color:#fff;font-size:15px">${timer}</b>s</div><div>🏆<b style="color:#fff;font-size:15px">${collection.length}</b>个</div></div>
    ${collection.length>=3?`<p style="color:var(--gold);font-size:11px">🎉 已解锁所有图案!</p>`:''}
    <button class="btn primary" onclick="nextPattern()">▶️ 下一个图案</button>
    <button class="btn ghost" onclick="shareCard()">📤 分享我的作品</button>
    <button class="btn ghost" onclick="showGallery()">🖼️ 收集画廊</button></div>`;ov.classList.remove('hidden');
  setTimeout(()=>{const pc=document.getElementById('prev');if(!pc)return;const pctx=pc.getContext('2d');const ps=140/pattern.size;for(let r=0;r<pattern.size;r++)for(let c=0;c<pattern.size;c++){if(board[r][c]===null)continue;pctx.fillStyle=pattern.colors[board[r][c]];pctx.fillRect(c*ps,r*ps,ps,ps)}},150);
}
function showLose(){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="ov"><h2>💔 生命用完了</h2><p style="color:#6b6b7b;font-size:13px">完成了 ${placed}/${totalBeads} (${Math.round(placed/totalBeads*100)}%)</p>
    <button class="btn ad" onclick="revive()">📺 看广告 — 复活 +❤️❤️❤️</button>
    <button class="btn primary" onclick="retry()">🔄 重试这个图案</button>
    <button class="btn ghost" onclick="showSelect()">📌 换一个图案</button></div>`;ov.classList.remove('hidden');
}
function revive(){showAd().then(ok=>{if(ok){lives=3;gameState='playing';timerId=setInterval(()=>{timer++;updateUI()},1000);hideOverlay();updateUI();draw()}})}
function retry(){hideOverlay();loadPattern(PATTERNS.findIndex(p=>p.id===pattern.id));gameState='playing';updateUI();draw()}
function nextPattern(){hideOverlay();const idx=(PATTERNS.findIndex(p=>p.id===pattern.id)+1)%PATTERNS.length;loadPattern(idx);gameState='playing';updateUI();draw()}
function hideOverlay(){document.getElementById('overlay').classList.add('hidden')}
function shareCard(){
  const text=`📌 我在PixelBead完成了「${pattern.emoji}${pattern.name}」!\n用时${timer}秒 | 收集${collection.length}个图案\n来挑战？`;
  if(navigator.share)navigator.share({title:'PixelBead拼豆大师',text}).catch(()=>{});
  else{navigator.clipboard.writeText(text).then(()=>{alert('已复制分享文字!');hideOverlay()})}
}
function showAd(){return new Promise(r=>{if(typeof wx!=='undefined'&&wx.createRewardedVideoAd){try{const a=wx.createRewardedVideoAd({adUnitId:'ad-unit'});a.onClose(res=>r(res&&res.isEnded));a.show().catch(()=>r(confirm('📺 看广告?')));return}catch(e){}}r(confirm('📺 看广告获取奖励？(上线展示真实广告)'))})}

// ── Gallery ──
function showGallery(){
  const ov=document.getElementById('overlay');
  let html=`<div class="ov"><h2>🖼️ 收集画廊</h2><p style="color:#6b6b7b;font-size:11px">${collection.length}/${PATTERNS.length} 个图案</p><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0">`;
  PATTERNS.forEach((p,i)=>{
    const owned=collection.includes(p.id);
    html+=`<div style="width:64px;text-align:center;${owned?'':'opacity:0.3'}"><div style="width:48px;height:48px;margin:0 auto;background:var(--surface);border-radius:4px;font-size:28px;line-height:48px">${owned?p.emoji:'🔒'}</div><div style="font-size:9px;margin-top:2px;color:${owned?'#fff':'#6b6b7b'}">${p.name}</div></div>`;
  });
  html+=`</div><button class="btn primary" onclick="showSelect()">开始拼豆</button></div>`;
  ov.innerHTML=html;ov.classList.remove('hidden');
}

// ── Pattern Select ──
function showSelect(){
  const ov=document.getElementById('overlay');
  let html=`<div class="ov"><h2>📌 选择图案</h2><p style="color:#6b6b7b;font-size:11px;margin:4px 0">收集3个解锁更多!</p><div class="pattern-grid" id="pattern-grid">`;
  PATTERNS.forEach((p,i)=>{
    const owned=collection.includes(p.id),locked=i>=3&&collection.length<3;
    const sel=i===PATTERNS.findIndex(x=>x.id===pattern?.id)?' sel':'';
    html+=`<div class="pcard${sel}${locked?' locked':''}" data-idx="${i}" data-locked="${locked}">
      <div class="thumb" style="background:var(--surface)">${owned?`<span style="font-size:28px">${p.emoji}</span>`:''}</div>
      <div class="name">${p.name}</div><div class="stars">${'⭐'.repeat(p.diff)}</div>${owned?`<div class="done">✅</div>`:''}</div>`;
  });
  html+=`</div><button class="btn primary" id="btn-start">开始拼豆</button><button class="btn ghost" id="btn-gallery">🖼️ 画廊</button></div>`;
  ov.innerHTML=html;ov.classList.remove('hidden');
  // Event delegation (avoids template literal onclick that Gate can't parse)
  document.getElementById('pattern-grid').addEventListener('click',function(e){
    const card=e.target.closest('.pcard');if(!card||card.classList.contains('locked'))return;
    pickAndStart(parseInt(card.dataset.idx));
  });
  document.getElementById('btn-start').onclick=function(){pickAndStart(PATTERNS.findIndex(x=>x.id===pattern?.id)||0)};
  document.getElementById('btn-gallery').onclick=showGallery;
}
function pickAndStart(i){loadPattern(i);gameState='playing';hideOverlay();updateUI();draw()}

// ── Province ──
function showProvinceSelect(){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="ov"><h2>📍 选择省份</h2><p style="color:#6b6b7b;font-size:11px">加入战队, 比拼排名!</p>
    <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0">${PROVINCES.map(p=>`<span style="padding:5px 10px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);font-size:11px;cursor:pointer;${p===province?'background:var(--gold);color:#000':'color:#6b6b7b'}" onclick="pickProv('${p}')">${p}</span>`).join('')}</div>
    <button class="btn primary" onclick="showSelect()">选择图案 →</button></div>`;ov.classList.remove('hidden');
}
function pickProv(p){province=p;lsSet('pb_prov',p);updateUI();showProvinceSelect()}

// ── Init ──
function init(){
  collection=JSON.parse(lsGet('pb_coll','[]'));bestTime=JSON.parse(lsGet('pb_times','{}'));
  province=lsGet('pb_prov','');updateUI();
  if(!province)showProvinceSelect();
  else{loadPattern(0);gameState='playing';draw()}
}
init();
</script>
